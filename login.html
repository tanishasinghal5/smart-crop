<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Welcome back — TerraByte</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"></head>
<body class="login-page"><header class="topbar transparent"><a href="index.html" class="logo"><b>✦</b> terra<span>byte</span></a><a class="login-link inverted" href="index.html">← Home</a></header><main class="login-main"><section class="login-photo"><div class="login-doodle">⌁ &nbsp; ⌁</div><p>Every season<br>has a story.</p></section><section class="login-panel"><p class="kicker">YOUR FARMER PROFILE</p><h1>Welcome<br><em>to your field.</em></h1><p class="login-copy">Enter your name and phone number. We’ll use them only in this browser to bring back your saved field plans.</p><form id="loginForm"><label>Your name<input name="name" autocomplete="name" placeholder="e.g. Meera Patel" required></label><label>Phone number<input name="phone" autocomplete="tel" inputmode="numeric" pattern="[0-9]{10}" placeholder="10-digit mobile number" required></label><button class="primary-button full-button" type="submit"><span>Continue to my field</span><span>↗</span></button></form><div class="history-preview" id="historyPreview"><p>Enter your number to see plans you saved earlier.</p></div></section></main><script src="app.js"></script></body></html>
