<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KrishiSahayak - Admin Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
</head>
<body class="bg-gray-50 text-gray-900 h-screen flex flex-col font-sans transition-colors duration-200">
    
    <header class="bg-green-800 text-white shadow-md z-10 flex justify-between items-center px-4 py-3 sm:px-6">
        <div class="flex items-center gap-2">
            <i class="fa-solid fa-leaf text-xl text-green-300"></i>
            <h1 class="text-xl font-bold tracking-tight">KrishiSahayak Admin</h1>
        </div>
        <div class="flex gap-4 items-center">
            <a href="index.html" class="text-sm bg-green-700 hover:bg-green-600 px-3 py-1.5 rounded transition">Back to Chat</a>
        </div>
    </header>

    <main class="flex-1 overflow-y-auto p-4 sm:p-6 w-full max-w-2xl mx-auto space-y-6 mt-10">
        <div class="bg-white p-8 rounded-2xl shadow-sm border border-gray-100 dark:bg-gray-800 dark:border-gray-700">
            <h2 class="text-2xl font-bold mb-2">Knowledge Base Upload</h2>
            <p class="text-gray-500 dark:text-gray-400 text-sm mb-6">Upload PDFs, TXT, or MD files containing agricultural guidelines. The RAG system will use these to answer farmer queries safely.</p>
            
            <form id="uploadForm" class="space-y-4">
                <div class="border-2 border-dashed border-gray-300 dark:border-gray-600 rounded-xl p-8 text-center hover:bg-gray-50 dark:hover:bg-gray-700 transition">
                    <i class="fa-solid fa-cloud-arrow-up text-4xl text-green-500 mb-3"></i>
                    <p class="text-sm font-medium">Click to select files or drag and drop</p>
                    <p class="text-xs text-gray-400 mt-1">PDF, TXT, MD (Max 10MB)</p>
                    <input type="file" id="fileUpload" accept=".pdf,.txt,.md" class="hidden" required>
                </div>
                <div id="selectedFile" class="text-sm text-green-600 font-medium hidden text-center"></div>
                
                <button type="submit" class="w-full bg-green-600 text-white font-medium p-3 rounded-lg hover:bg-green-700 transition shadow flex justify-center items-center gap-2">
                    <i class="fa-solid fa-upload"></i> Upload to Vector Database
                </button>
            </form>

            <div id="uploadStatus" class="mt-4 text-center text-sm hidden font-medium p-3 rounded"></div>
        </div>
    </main>

    <script>
        const fileUpload = document.getElementById('fileUpload');
        const fileDiv = document.querySelector('.border-dashed');
        const selectedFile = document.getElementById('selectedFile');
        const uploadForm = document.getElementById('uploadForm');
        const uploadStatus = document.getElementById('uploadStatus');

        fileDiv.addEventListener('click', () => fileUpload.click());

        fileUpload.addEventListener('change', () => {
            if (fileUpload.files.length > 0) {
                selectedFile.textContent = "Selected: " + fileUpload.files[0].name;
                selectedFile.classList.remove('hidden');
            }
        });

        uploadForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const file = fileUpload.files[0];
            if (!file) return;

            const formData = new FormData();
            formData.append('file', file);

            const btn = uploadForm.querySelector('button');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Processing...';
            btn.disabled = true;
            
            uploadStatus.classList.add('hidden');

            try {
                const res = await fetch('http://localhost:8001/api/upload', {
                    method: 'POST',
                    body: formData
                });
                const data = await res.json();
                
                uploadStatus.classList.remove('hidden', 'bg-red-50', 'text-red-600');
                uploadStatus.classList.add('bg-green-50', 'text-green-700');
                uploadStatus.textContent = "Success! " + (data.message || "Document added to knowledge base.");
                
                // reset
                fileUpload.value = '';
                selectedFile.classList.add('hidden');
            } catch (err) {
                uploadStatus.classList.remove('hidden', 'bg-green-50', 'text-green-700');
                uploadStatus.classList.add('bg-red-50', 'text-red-600');
                uploadStatus.textContent = "Error: Could not connect to backend server.";
            } finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
