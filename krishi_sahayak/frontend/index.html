<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KrishiSahayak - AI Agricultural Advisor</title>
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
</head>
<body class="bg-[#11271a] text-[#e9eee4] h-screen flex flex-col font-sans transition-colors duration-200">
    
    <!-- Navbar -->
    <header class="bg-[#16402a] text-[#e9eee4] shadow-md z-10 flex justify-between items-center px-4 py-3 sm:px-6">
        <div class="flex items-center gap-2">
            <i class="fa-solid fa-leaf text-xl text-[#d7b46a]"></i>
            <h1 class="text-xl font-bold tracking-tight" style="font-family: 'Fraunces', serif;">KrishiSahayak</h1>
        </div>
        <div class="flex gap-4 items-center">
            <select id="languageSelect" class="bg-[#102516] text-sm border border-[#294632] rounded px-2 py-1 outline-none focus:ring-2 focus:ring-[#d7b46a]">
                <option value="English">English</option>
                <option value="Hindi">हिंदी</option>
                <option value="Marathi">मराठी</option>
                <option value="Telugu">తెలుగు</option>
            </select>
            <button id="themeToggle" class="text-xl hover:text-[#d7b46a] transition hidden" aria-label="Toggle Dark Mode">
                <i class="fa-solid fa-moon"></i>
            </button>
            <a href="admin.html" class="text-sm bg-[#102516] hover:bg-[#294632] px-3 py-1.5 rounded transition">Admin</a>
        </div>
    </header>

    <!-- Chat Container -->
    <main class="flex-1 overflow-y-auto p-4 sm:p-6 w-full max-w-4xl mx-auto space-y-6" id="chatBox">
        
        <!-- Welcome Message -->
        <div class="flex gap-4 message bot-message">
            <div class="w-10 h-10 rounded-full bg-[#d7b46a] flex items-center justify-center flex-shrink-0 text-[#16402a]">
                <i class="fa-solid fa-seedling text-lg"></i>
            </div>
            <div class="bg-[#173321] p-4 rounded-2xl rounded-tl-none shadow-sm border border-[#294632] max-w-[85%] bot-bubble">
                <p class="text-sm" data-i18n="welcome">Namaskar! I am KrishiSahayak, your AI Agricultural Advisor. How can I help you with your farm today?</p>
                
                <div class="mt-4 flex flex-wrap gap-2">
                    <button class="starter-btn text-xs bg-transparent text-[#e9eee4] border border-[#d7b46a] rounded-full px-3 py-1 hover:bg-[#294632] transition" data-i18n="starter1">How to control aphids in cotton?</button>
                    <button class="starter-btn text-xs bg-transparent text-[#e9eee4] border border-[#d7b46a] rounded-full px-3 py-1 hover:bg-[#294632] transition" data-i18n="starter2">Best fertilizer for wheat</button>
                    <button class="starter-btn text-xs bg-transparent text-[#e9eee4] border border-[#d7b46a] rounded-full px-3 py-1 hover:bg-[#294632] transition" data-i18n="starter3">Today's weather impact on irrigation</button>
                </div>
            </div>
        </div>

    </main>

    <!-- Input Area -->
    <footer class="bg-[#16402a] border-t border-[#294632] p-4 shrink-0 shadow-lg">
        <div class="max-w-4xl mx-auto">
            <form id="chatForm" class="flex gap-2 items-end">
                
                <!-- File Upload Button -->
                <label class="cursor-pointer p-3 text-[#b4c2ae] hover:text-[#d7b46a] hover:bg-[#102516] rounded-full transition flex-shrink-0">
                    <i class="fa-solid fa-paperclip text-lg"></i>
                    <input type="file" id="imageUpload" accept="image/*" class="hidden">
                </label>
                
                <div class="flex-1 relative bg-[#102516] rounded-2xl border border-[#294632] focus-within:border-[#d7b46a] focus-within:ring-1 focus-within:ring-[#d7b46a] transition overflow-hidden">
                    <div id="imagePreviewContainer" class="hidden p-2 border-b border-[#294632] bg-[#173321] flex gap-2 overflow-x-auto">
                        <!-- Image preview will be injected here -->
                    </div>
                    <textarea 
                        id="messageInput" 
                        rows="1" 
                        placeholder="Type your agricultural question here..." 
                        data-i18n-placeholder="placeholder"
                        class="w-full bg-transparent text-[#e9eee4] p-3 outline-none resize-none max-h-32 text-sm"
                    ></textarea>
                </div>
                
                <button type="submit" class="p-3 bg-[#d7b46a] text-[#16402a] rounded-full hover:bg-[#efd182] transition flex-shrink-0 shadow-md">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </form>
            <p class="text-center text-[10px] text-[#b4c2ae] mt-2" data-i18n="disclaimer">
                Disclaimer: Recommendations are AI-generated general guidance. Please verify with local agronomists before applying chemicals.
            </p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
